<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PLANNING RAMADHAN 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{font-family:sans-serif;background:#f6edf6;margin:0;text-align:center}
.box{margin:40px auto;background:white;padding:20px;border-radius:20px;width:400px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
button{padding:10px 20px;border:none;border-radius:10px;background:#c8a2c8;color:white;cursor:pointer}
input{padding:8px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h2>Enter Your Username</h2>
<input id="username">
<br><br>
<button onclick="login()">Start</button>
</div>

<div class="box" id="app" style="display:none">
<h2 id="welcome"></h2>
<p>Your progress: <span id="progress">0%</span></p>
<button onclick="toggleHabit()">Complete Today's Habit</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "PASTE YOUR API KEY",
  authDomain: "PASTE",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser=null;

function login(){
  const name=document.getElementById("username").value;
  if(!name)return alert("Enter username");

  currentUser=name;

  db.collection("users").doc(name).get().then(doc=>{
    if(!doc.exists){
      db.collection("users").doc(name).set({progress:0});
    }
    loadApp();
  });
}

function loadApp(){
  loginBox.style.display="none";
  app.style.display="block";
  welcome.textContent="Welcome, "+currentUser;

  db.collection("users").doc(currentUser).onSnapshot(doc=>{
    progress.textContent=doc.data().progress+"%";
  });
}

function toggleHabit(){
  db.collection("users").doc(currentUser).get().then(doc=>{
    let p=doc.data().progress+5;
    if(p>100)p=100;
    db.collection("users").doc(currentUser).update({progress:p});
  });
}
</script>

</body>
  </html>
